[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "doc-extractor"
version = "0.1.1"
description = "Multi-agent pipeline that extracts attributes, real-world entities, and attribute-to-entity mappings from unstructured documents."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "langgraph>=1.2,<2",
    "langgraph-checkpoint-sqlite>=3.1,<4",
    "pydantic>=2.11,<3",
    "openai>=3,<4",
    "pypdf>=6",
    "pdfplumber>=0.11",
    "python-docx>=1.2",
    "rapidfuzz>=3.14",
    "pyyaml>=6",
    "structlog>=26",
    "networkx>=3.4",
    "python-dotenv>=1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "reportlab>=4",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML",
]
ocr = ["pytesseract>=0.3", "pillow>=10"]

[project.scripts]
doc-extractor = "doc_extractor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
doc_extractor = ["config/*.yaml", "config/lexicons/*.yaml", "llm/prompts/*.md", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live' -q"
markers = [
    "live: tests that call Azure OpenAI (skipped unless AZURE_OPENAI_* are set)",
]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
packages = ["doc_extractor"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = true
