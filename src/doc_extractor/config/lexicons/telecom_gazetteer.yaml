# Telecom attribute gazetteer. Keys are canonical names; values list aliases/expansions.
# A hit on either key or alias fires lexical.gazetteer_hit.
MSISDN: [Mobile Station International Subscriber Directory Number, mobile number]
IMSI: [International Mobile Subscriber Identity]
ICCID: [Integrated Circuit Card Identifier]
IMEI: [International Mobile Equipment Identity]
APN: [Access Point Name]
VLAN ID: [VLAN identifier, VLAN, C-VLAN ID, S-VLAN ID, CE-VLAN ID]
CIR: [Committed Information Rate]
PIR: [Peak Information Rate]
EIR: [Excess Information Rate]
CBS: [Committed Burst Size]
EBS: [Excess Burst Size]
DSCP: [Differentiated Services Code Point]
CoS: [Class of Service, CoS Name, CoS ID]
PLMN: [Public Land Mobile Network, PLMN ID]
RAT type: [Radio Access Technology, RAT]
MRC: [Monthly Recurring Charge]
NRC: [Non-Recurring Charge]
SLA tier: [SLA, Service Level Agreement tier, SLA level]
MTU: [Maximum Transmission Unit]
QoS: [Quality of Service]
EVC ID: [EVC identifier]
UNI ID: [UNI identifier]
Port Speed: [port rate, interface speed]
MAC Address: [MAC, Media Access Control address]
Physical Medium: [physical layer, medium]
Service Type: [service kind]
Bandwidth Profile: [BWP]
Frame Delay: [FD, one-way frame delay]
Frame Loss Ratio: [FLR]
Availability: [service availability]
